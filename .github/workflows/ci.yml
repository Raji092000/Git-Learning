name: Git Learning CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building the project..."

      - name: Check notes file
        run: grep -q "Hello Devops" notes.txt

      - name: Run test
        run: echo "All tests passed!"

      - name: Create package
        run: |
          mkdir package
          cp notes.txt package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-learning-package
          path: package/
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        env:
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}
        run: |
          mkdir deployed-app
          cp notes.txt deployed-app/
          echo "Starting deployment..."
          echo "$DEPLOY_MESSAGE"
          echo "Application deployed successfully!"
          ls -la deployed-app