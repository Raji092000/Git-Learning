name: Git Learning CI

on:
  push:
    branches:
      - dev
      - staging
      - master
  pull_request:
    branches:
      - dev
      - staging
      - master
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building the project..."

      - name: Check notes file
        run: grep -q "Hello Devops" notes.txt

      - name: Run test
        run: echo "All tests passed!"

      - name: Create package
        run: |
          mkdir package
          cp notes.txt package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-learning-package
          path: package/
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'development' || github.ref_name == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        env:
          DEPLOY_MESSAGE: ${{ secrets.DEPLOY_MESSAGE }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          mkdir deployed-app
          cp notes.txt deployed-app/
          echo "Starting deployment..."
          echo "$DEPLOY_MESSAGE"
          echo "Environment: $APP_ENV"
          echo "Application deployed successfully!"
          ls -la deployed-app